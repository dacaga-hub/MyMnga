version: 2
updates:
  - package-ecosystem: npm
    directory: /manga-reader
    target-branch: beta-manga-store
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /manga-reader/src-tauri
    target-branch: beta-manga-store
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta-manga-store
    schedule:
      interval: monthly
